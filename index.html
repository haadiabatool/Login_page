<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Connecting CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="formContainer formForSignIn">
        <!-- Form  for Sign in -->
        <form action="POST">
            <h2>Login</h2>

            <label>Email</label>
            <br>
            <input type="email" id="email" placeholder="Enter your Email">

            <br>
            <label>Password</label>
            <br>
            <input type="password" id="password" placeholder="Enter your password">
            <a href="#">Forgot password</a>
            <br>
            <label id="rememberLabel"><input type="checkbox" id="RememberMe">Remember me</label>
            <br>
            <button type="submit" class="BtnSignIn">Login</button>
            <p class="paraText signInText">If don't have an account?<a href="#" id="showSignUp">Sign Up</a></p>
        </form>
    </div>

    <div class="formContainer formForSignUp hidden">
        <!-- Don't have account sign Up -->
        <form action="POST">
            <h2>Sign Up</h2>
            <label>Username</label>
            <br>
            <input type="name" id="signUpName" placeholder="Enter your name">
            <br>
            <label>Email</label>
            <br>
            <input type="email" id="signUpEmail" placeholder="Enter your Email">
            <br>
            <label>Password</label>
            <br>
            <input type="password" id="signUpPassword" placeholder="Enter your password">
            <br>
            <label>Confirm Password</label>
            <br>
            <input type="password" id="confirmPassword" placeholder="Enter your password">
            <br>
            <button type="submit" class="BtnSignUp">Sign Up</button>
            <p class="paraText signUpText">Already have an account?<a href="#" id="showLogin">Login</a></p>

        </form>
    </div>

    <!-- Connecting JavaScript -->
    <script src="index.js"></script>

</body>

</html>
