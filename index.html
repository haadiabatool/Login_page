<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="formForSignIn">
        <!-- Form  for Sign in -->
         <form action="POST">
            <h2>Login</h2>
            
            <label>Email</label>
            <br>
            <input type="email" id="email" placeholder="Enter your Email">
    
            <br>
            <label>Password</label>
            <br>
            <input type="password" id="password" placeholder="Enter your password">
            <a href="#">Forgot password</a>
            <br>
            <label id="rememberLabel"><input type="checkbox" id="RememberMe">Remember me</label>
            <br>
            <button type="submit" class="BtnSignIn">Login</button>
            <p class="signupText">If don't have account?<a href="#">Sign Up</a></p>
        </form>
    </div>
